title: Review auth middleware snippet
prompt: |
  Review this PR snippet for issues:

  ```python
  def require_auth(handler):
      def wrapper(req):
          token = req.headers.get("Authorization")
          user = cache.get(token)  # may be None
          req.user = user
          return handler(req)
      return wrapper
